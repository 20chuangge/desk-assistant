name: iOS IPA

# Builds the Desk iOS app on a macOS runner. Requires macOS because `cap add ios`
# can only *generate* the Xcode project on Windows — xcodebuild, CocoaPods and
# code signing all need Xcode.
#
# Outcomes:
#   - with signing secrets -> Desk.ipa (App Store / ad-hoc installable)
#   - without secrets      -> Desk.xcarchive (UNSIGNED; inspectable, not installable)
#
# Secrets (all optional; empty = unsigned build):
#   CERT_P12_BASE64                Distribution certificate .p12, base64
#   CERT_PASSWORD                  password of that .p12
#   PROVISIONING_PROFILE_BASE64    App Store .mobileprovision, base64
#   PROVISIONING_PROFILE_NAME      optional override; otherwise read from the profile
#   TEAM_ID                        Apple Developer team id
#   APPSTORE_ISSUER_ID             App Store Connect API issuer id (upload)
#   APPSTORE_KEY_ID                App Store Connect API key id (upload)
#   APPSTORE_PRIVATE_KEY           App Store Connect API .p8 contents (upload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'public/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'public/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  ipa:
    name: Build Desk.xcarchive / Desk.ipa
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: npm ci

      - name: Build webDir from public/
        run: npm run sync:www

      - name: Sync Capacitor (plugins + web assets into ios/)
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: |
          pod --version || sudo gem install cocoapods
          pod install

      - name: List schemes
        run: xcodebuild -list -workspace ios/App/App.xcworkspace

      - name: Import signing certificate + provisioning profile
        if: ${{ env.CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/desk-signing.keychain-db"
          KEYCHAIN_PASS="desk-$RANDOM-$RANDOM"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$CERT_P12_BASE64" | tr -d '\r\n' | openssl base64 -d -A \
            > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          if [ -n "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            printf '%s' "$PROVISIONING_PROFILE_BASE64" | tr -d '\r\n' | openssl base64 -d -A \
              > "$RUNNER_TEMP/desk.mobileprovision"
            cp "$RUNNER_TEMP/desk.mobileprovision" \
              "$HOME/Library/MobileDevice/Provisioning Profiles/desk.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/desk.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          fi

      - name: Render ExportOptions.plist
        if: ${{ env.CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          PROFILE_NAME="${PROVISIONING_PROFILE_NAME:-}"
          if [ -z "$PROFILE_NAME" ] && [ -f "$RUNNER_TEMP/profile.plist" ]; then
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          fi
          : "${TEAM_ID:?TEAM_ID secret is required for a signed build}"
          : "${PROFILE_NAME:?could not determine the provisioning profile name}"
          echo "Exporting with team $TEAM_ID / profile $PROFILE_NAME"
          sed -e "s|__TEAM_ID__|$TEAM_ID|g" -e "s|__PROFILE_NAME__|$PROFILE_NAME|g" \
            ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive (unsigned)
        if: ${{ env.CERT_P12_BASE64 == '' }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Desk.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          echo "UNSIGNED archive: not installable — signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Archive (signed)
        if: ${{ env.CERT_P12_BASE64 != '' }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Desk.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        if: ${{ env.CERT_P12_BASE64 != '' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Desk.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          ls -l "$RUNNER_TEMP/export"

      # Optional: upload straight to App Store Connect with the API key.
      # `altool`'s upload path is deprecated (and may be gone in newer Xcode);
      # if this step fails, take the .ipa artifact and drop it into Transporter.app.
      - name: Upload to App Store Connect (optional)
        if: ${{ env.CERT_P12_BASE64 != '' && env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-ios
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Desk.xcarchive
          if-no-files-found: error
          retention-days: 30
