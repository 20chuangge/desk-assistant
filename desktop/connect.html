<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>连接到 Desk Hub</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0d12; color: #e6e8ee; display: grid; align-content: center; gap: 10px;
    padding: 22px; font: 13px/1.5 "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-app-region: drag;
  }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  p { margin: 0; color: #98a1b2; font-size: 12px; }
  input {
    -webkit-app-region: no-drag;
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #2a3142; background: #12151d; color: #e6e8ee; font: inherit; outline: none;
  }
  input:focus { border-color: #6d5efc; box-shadow: 0 0 0 3px rgba(109,94,252,.18); }
  .row { display: flex; gap: 8px; margin-top: 6px; -webkit-app-region: no-drag; }
  button {
    flex: 1; padding: 9px 14px; border-radius: 10px; border: 1px solid #2a3142;
    background: #171b24; color: #e6e8ee; font: inherit; cursor: pointer;
  }
  button.primary { background: #6d5efc; border-color: #6d5efc; font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: #fb7185; min-height: 16px; font-size: 12px; }
</style>
</head>
<body>
  <h1>连接到 Desk Hub</h1>
  <p>填那台常开机器（或云主机）的地址。它会在设置里显示配对码，浏览器里输一次就记住了。</p>
  <input id="url" spellcheck="false" placeholder="http://192.168.1.20:4390">
  <div class="err" id="err"></div>
  <div class="row">
    <button id="local">用本机</button>
    <button class="primary" id="go">连接</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const err = $('err');
    $('url').focus();
    $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
    $('go').addEventListener('click', async () => {
      err.textContent = '';
      const raw = $('url').value.trim();
      if (!raw) { err.textContent = '先填一个地址'; return; }
      const url = /^https?:\/\//i.test(raw) ? raw : `http://${raw}`;
      $('go').disabled = true;
      $('go').textContent = '连接中…';
      const res = await window.desk.setHub(url);
      if (!res || !res.ok) {
        err.textContent = (res && res.error) || '连不上，检查地址和防火墙';
        $('go').disabled = false;
        $('go').textContent = '连接';
      }
    });
    $('local').addEventListener('click', async () => { await window.desk.useLocal(); });
    (async () => {
      const cur = await window.desk.current();
      if (cur) $('url').value = cur;
    })();
  </script>
</body>
</html>
